<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Backdrops</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2306080d'/%3E%3Ctext x='50' y='72' font-size='60' fill='%2300e054' text-anchor='middle' font-family='Arial, sans-serif'%3E%F0%9F%96%BC%EF%B8%8F%3C/text%3E%3C/svg%3E">
  
  <!-- Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* DASAR HITAM & TRANSISI */
    html, body { width: 100%; background-color: #06080d !important; color: #ffffff; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { min-height: 100vh; padding: 12px; display: flex; position: relative; animation: fadeInPage 0.5s ease forwards; overflow: hidden; /* Cegah scroll body */}
    @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
    body.fade-out { opacity: 0 !important; transition: opacity 0.4s ease; }

    /* BACKGROUND & TOMBOL BACK */
    #bgLayer { position: fixed; inset: 0; z-index: 0; background-image: url('../bg.jpg') !important; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 1 !important; pointer-events: none; }
    #bgLayer::before { content: ""; position: absolute; inset: 0; background: rgba(6, 8, 13, 0.35); z-index: 1; }

    .btn-back-home { position: fixed; top: 20px; left: 20px; z-index: 9999; display: inline-flex; align-items: center; gap: 8px; background: rgba(20, 24, 28, 0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 8px 14px; font-size: 11.5px; font-weight: 700; color: #fff; text-decoration: none; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .btn-back-home:hover { background: rgba(25, 30, 36, 0.9); border-color: #00e054; color: #00e054; transform: translateY(-2px); }

    /* LAYOUT DUA PANEL */
    :root {
      --accent: #00e054;
      --accent2: #ff8000;
      --panel-bg: rgba(20, 24, 28, 0.72);
      --panel-blur: 12px;
      --gap: 28px;
      --stage-h: min(calc(100vh - 24px), calc((100vw - 442px - 30px) * 1.7778 + 30px), 1100px);
      --stage-w: calc((var(--stage-h) - 30px) * 0.5625 + 30px);
      --left-w: clamp(380px, calc(var(--stage-w) * 1.2), 550px);
    }

    .main-layout { position: relative; z-index: 1; margin: auto; height: var(--stage-h); display: grid; grid-template-columns: var(--left-w) var(--stage-w); column-gap: var(--gap); align-items: stretch; }

    /* PANEL KIRI */
    .control-panel { 
      height: 100%; min-height: 0; 
      background: var(--panel-bg); -webkit-backdrop-filter: blur(var(--panel-blur)); backdrop-filter: blur(var(--panel-blur)); 
      border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 12px; padding: 16px; 
      display: flex; flex-direction: column; gap: 10px; overflow: hidden; /* Scroll diatur per elemen */
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
    }

    .panel-title { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 2px; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; flex: 0 0 auto; }
    .form-group label { font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .form-grid .full { grid-column: span 2; }

    input[type="text"], select, textarea { background: #0f1115; border: 1px solid #2c3440; color: #fff; padding: 7px; border-radius: 6px; font-size: 11px; outline: none; width: 100%; }
    input[type="text"]:focus, select:focus, textarea:focus { border-color: var(--accent); }
    
    input[type="file"] { color: #8a9bb0; background: #0f1115; border: 1px solid #2c3440; padding: 4px; border-radius: 6px; font-size: 11px; cursor: pointer; width: 100%; flex: 0 0 auto; }
    input[type="file"]::file-selector-button { background: #222a33; color: #ffffff; border: 1px solid #3a4654; padding: 5px 10px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-right: 6px; }
    
    textarea { font-family: monospace; font-size: 10.5px; line-height: 1.4; resize: none; height: 60px; flex: 0 0 auto; }

    .btn { padding: 8px 10px; border: none; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex: 0 0 auto; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn-parse { background: var(--accent); color: #14181c; flex: 1; }
    .btn-parse:hover { background: #00b342; }
    .btn-clear { background: #2c3440; color: #ffffff; }
    .btn-export { background: var(--accent2); color: #ffffff; flex: 1; }
    .btn-export:hover { background: #e07000; }
    .btn-all { background: #3b82f6; color: #ffffff; width: 100%; margin-top: 4px; }

    .pagination-bar { display: flex; align-items: center; justify-content: space-between; background: #0f1115; border: 1px solid #2c3440; border-radius: 6px; padding: 4px 8px; flex: 0 0 auto; }
    .pagination-bar button { background: #2c3440; color: #fff; border: none; padding: 4px 8px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: 700; }
    .pagination-bar button:hover { background: var(--accent); color: #14181c; }

    /* DAFTAR EDIT FILM (SCROLLABLE) */
    .csv-movie-list { margin-top: 2px; display: flex; flex-direction: column; gap: 6px; overflow-y: auto; padding-right: 4px; flex: 1 1 auto; min-height: 100px; }
    .csv-movie-list::-webkit-scrollbar { width: 6px; }
    .csv-movie-list::-webkit-scrollbar-thumb { background: #2c3440; border-radius: 3px; }

    .csv-movie-card { background: #0f1115; border: 1px solid #2c3440; border-radius: 6px; padding: 6px 8px; display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
    .movie-title { font-weight: 700; font-size: 10.5px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .movie-title span { color: #8a9bb0; font-weight: 500; font-size: 9.5px; }
    .poster-inputs input[type="text"] { font-size: 9.5px; padding: 4px; }

    /* PANEL KANAN */
    .stage-panel { position: relative; height: 100%; background: var(--panel-bg); -webkit-backdrop-filter: blur(var(--panel-blur)); backdrop-filter: blur(var(--panel-blur)); border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .stage-inner { position: absolute; inset: 14px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    .card-holder { position: relative; width: 450px; height: 800px; transform: scale(var(--s, 1)); transform-origin: center center; }
    .recap-card { width: 450px; height: 800px; background-color: transparent; padding: 24px 20px 18px 20px; border-radius: 12px; display: flex; flex-direction: column; position: relative; overflow: hidden; }

    /* HEADER KANVAS */
    .card-header { text-align: center; margin-bottom: 14px; flex: 0 0 auto; }
    .month-title { font-size: 23px; font-weight: 800; color: #ffffff; letter-spacing: -0.5px; line-height: 1.1; }
    .header-sub-row { display: flex; align-items: center; justify-content: center; gap: 8px; margin-top: 4px; }
    .stats-subtitle { font-size: 11px; color: var(--accent); font-weight: 700; }
    .page-badge { font-size: 10px; color: #ffffff; background: rgba(255,255,255,0.1); padding: 2px 6px; border-radius: 4px; font-weight: 700; }

    /* GRID BACKDROP (2 KOLOM x 5 BARIS) */
    .backdrop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; align-content: start; flex-grow: 1; margin-top: 6px; margin-bottom: auto; width: 100%; }
    
    .backdrop-item { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 6px; overflow: hidden; background-color: #1e262c; border: 1px solid rgba(255,255,255,0.08); box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: flex; flex-direction: column; justify-content: flex-end; }
    .backdrop-img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
    
    .gradient-overlay { position: relative; z-index: 2; width: 100%; padding: 16px 6px 4px 6px; background: linear-gradient(to top, rgba(0, 0, 0, 0.9) 0%, rgba(0, 0, 0, 0.4) 60%, transparent 100%); display: flex; flex-direction: column; justify-content: flex-end; }
    .movie-title-text { font-size: 9.5px; font-weight: 700; color: #ffffff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.2; text-shadow: 0 1px 2px rgba(0,0,0,0.8); }
    .movie-year-text { font-size: 8px; color: #b0c0d0; font-weight: 500; margin-top: 1px; }

    /* FOOTER KANVAS */
    .user-profile-card { flex: 0 0 auto; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; margin-top: 12px; display: flex; align-items: center; justify-content: space-between; }
    .lbxd-brand { display: flex; align-items: center; gap: 6px; }
    .lbxd-dots { font-size: 10.5px; letter-spacing: -2px; line-height: 1; }
    .brand-name { font-size: 10.5px; font-weight: 800; color: #ffffff; }
    .user-handle-info { display: flex; flex-direction: column; align-items: flex-end; }
    .user-handle-info .handle-text { font-size: 10px; font-weight: 700; color: #ffffff; }
    .user-handle-info .sub-cta { font-size: 7.5px; color: #8a9bb0; text-transform: uppercase; letter-spacing: 0.8px; }

    @media (max-width: 900px) {
      .main-layout { width: 100%; height: auto; grid-template-columns: 1fr; row-gap: 15px; }
      .stage-panel { height: auto; width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 9/16; }
    }
  </style>
</head>
<body>

<a href="../" class="btn-back-home" onclick="goBackHome(event)">
  <i class="fa-solid fa-arrow-left"></i> Kembali ke Home
</a>

<div id="bgLayer"></div>

<div class="main-layout">
  
  <!-- PANEL KIRI -->
  <div class="control-panel">
    <div class="panel-title"><i class="fa-solid fa-images"></i> Monthly Backdrops</div>

    <div class="form-group">
      <label>1. Upload ZIP Letterboxd</label>
      <input type="file" id="zipFileInput" accept=".zip" onchange="processZipFile()">
    </div>
    
    <div class="form-grid">
      <div class="form-group">
        <label>Bulan</label>
        <select id="selectMonth" onchange="applySorting()">
          <option value="01">Januari</option>
          <option value="02">Februari</option>
          <option value="03">Maret</option>
          <option value="04">April</option>
          <option value="05">Mei</option>
          <option value="06">Juni</option>
          <option value="07">Juli</option>
          <option value="08">Agustus</option>
          <option value="09" selected>September</option>
          <option value="10">Oktober</option>
          <option value="11">November</option>
          <option value="12">Desember</option>
        </select>
      </div>
      <div class="form-group">
        <label>Tahun</label>
        <input type="text" id="selectYear" value="2026" oninput="applySorting()">
      </div>
      
      <div class="form-group full">
        <label>Urutan Tanggal</label>
        <select id="sortOrder" onchange="applySorting()">
          <option value="asc">Terlama ke Terbaru (Awal → Akhir)</option>
          <option value="desc">Terbaru ke Terlama (Akhir → Awal)</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label>2. Paste Massal Link Backdrop (16:9)</label>
      <textarea id="bulkUrls" placeholder="https://image.tmdb.org/t/p/w780/...&#10;https://image.tmdb.org/t/p/w780/..."></textarea>
      <button class="btn btn-parse" style="margin-top:4px;" id="btnBulk" onclick="applyBulkUrls()"><i class="fa-solid fa-wand-magic-sparkles"></i> Terapkan Semua Backdrop</button>
    </div>

    <div class="btn-group" style="display:flex; gap:8px;">
      <button class="btn btn-clear" onclick="clearAll()"><i class="fa-solid fa-rotate-left"></i> Reset</button>
    </div>

    <div class="pagination-bar">
      <button onclick="prevPage()"><i class="fa-solid fa-chevron-left"></i> Prev</button>
      <span id="pageIndicatorText" style="font-size: 10px; font-weight: 700; color: var(--accent);">Slide 1 dari 1</span>
      <button onclick="nextPage()">Next <i class="fa-solid fa-chevron-right"></i></button>
    </div>

    <div class="btn-group" style="flex-direction: column; gap: 6px;">
      <button class="btn btn-export" onclick="exportCurrentPNG()"><i class="fa-solid fa-download"></i> Export Slide Ini</button>
      <button class="btn btn-all" id="btnExportAll" onclick="exportAllPagesPNG()"><i class="fa-solid fa-layer-group"></i> Export Semua Slide</button>
    </div>

    <!-- DAFTAR EDIT -->
    <div class="csv-movie-list" id="csvMovieList"></div>
  </div>

  <!-- PANEL KANAN (KANVAS) -->
  <div class="stage-panel">
    <div class="stage-inner" id="stageInner">
      <div class="card-holder" id="cardHolder">
        
        <div class="recap-card" id="exportCard">
          <div class="card-header">
            <div class="month-title" id="displayMonth">September 2026</div>
            <div class="header-sub-row">
              <span class="stats-subtitle" id="displayStats">0 films</span>
              <span class="page-badge" id="cardPageIndicator">1/1</span>
            </div>
          </div>

          <div class="backdrop-grid" id="backdropGrid"></div>

          <div class="user-profile-card">
            <div class="lbxd-brand">
              <div class="lbxd-dots">
                <span style="color:#00e054;">●</span><span style="color:#ff8000;">●</span><span style="color:#40bcf4;">●</span>
              </div>
              <span class="brand-name">Letterboxd</span>
            </div>
            <div class="user-handle-info">
              <span class="handle-text js-handle">letterboxd.com/hwangik</span>
              <span class="sub-cta">Follow on Letterboxd</span>
            </div>
          </div>
        </div>

      </div>
    </div>
  </div>
</div>

<script>
  function goBackHome(e) {
    e.preventDefault();
    document.body.classList.add('fade-out');
    setTimeout(() => { window.location.href = '../'; }, 400);
  }

  const MONTHS = ["Januari", "Februari", "Maret", "April", "Mei", "Juni", "Juli", "Agustus", "September", "Oktober", "November", "Desember"];
  let movies = [];
  let currentPage = 0;
  const pageSize = 10;

  // Ambil Base64 untuk Gambar (Hindari CORS)
  async function fetchImageAsBase64(url) {
    const cleanUrl = url.trim().replace(/^"|"$/g, '');
    const proxyList = [
      u => `https://images.weserv.nl/?url=${encodeURIComponent(u)}`,
      u => `https://api.allorigins.win/raw?url=${encodeURIComponent(u)}`
    ];

    for (let getProxy of proxyList) {
      try {
        const res = await fetch(getProxy(cleanUrl));
        if (!res.ok) continue;
        const blob = await res.blob();
        if (blob.size > 0) {
          return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onloadend = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(blob);
          });
        }
      } catch (err) {
        console.warn("Proxy attempt failed:", err);
      }
    }
    return cleanUrl;
  }

  // FUNGSI IMPORT ZIP
  async function processZipFile() {
    const file = document.getElementById('zipFileInput').files[0];
    if (!file) return;
    const month = document.getElementById('selectMonth').value;
    const year = document.getElementById('selectYear').value.trim();
    
    document.getElementById('displayMonth').innerText = `${MONTHS[parseInt(month)-1]} ${year}`;

    try {
      const zip = await JSZip.loadAsync(file);
      const findFile = re => zip.file(re).filter(f => !/(^|\/)(deleted|orphaned)\//i.test(f.name))[0] || null;
      const readCSV = async re => {
        const f = findFile(re);
        if (!f) return null;
        const text = (await f.async('string')).replace(/^\uFEFF/, '');
        return Papa.parse(text, { header: true, skipEmptyLines: true }).data;
      };

      const diary = await readCSV(/(^|\/)diary\.csv$/i);
      if (!diary) { alert('Error: diary.csv tidak ditemukan di dalam ZIP.'); return; }

      // Ambil profile untuk link
      const profile = await readCSV(/(^|\/)profile\.csv$/i);
      if (profile && profile[0] && profile[0]['Username']) {
        document.querySelectorAll('.js-handle').forEach(el => { el.innerText = 'letterboxd.com/' + profile[0]['Username'].trim(); });
      }

      movies = [];
      diary.forEach((row, index) => {
        const watchDate = row['Watched Date'] || row['Date'];
        if (!watchDate) return;

        const dateParts = watchDate.split('-');
        if (dateParts.length >= 2) {
          const y = dateParts[0].trim();
          const m = dateParts[1].trim();
          const day = dateParts[2] ? parseInt(dateParts[2].trim()) : index;

          if (y === year && m === month) {
            const title = row['Name'] || 'Untitled';
            const releaseYear = row['Year'] || '';
            const placeholder = 'https://via.placeholder.com/600x337/242c34/ffffff?text=' + encodeURIComponent(title);

            movies.push({
              id: 'm_' + index + '_' + Date.now(),
              originalIndex: index,
              title: title,
              year: releaseYear,
              rawDate: watchDate,
              day: day,
              imageSrc: placeholder
            });
          }
        }
      });

      currentPage = 0;
      applySorting();

      document.getElementById('displayStats').innerText = `${movies.length} films watched`;

      if (movies.length === 0) {
        alert(`Tidak ada film di bulan ${MONTHS[parseInt(month)-1]} ${year} pada diary Anda.`);
      }

    } catch (err) {
      alert('Gagal: ' + err.message);
    }
  }

  function applySorting() {
    const month = document.getElementById('selectMonth').value;
    const year = document.getElementById('selectYear').value.trim();
    document.getElementById('displayMonth').innerText = `${MONTHS[parseInt(month)-1]} ${year}`;

    const order = document.getElementById('sortOrder').value;
    if (order === 'desc') {
      movies.sort((a, b) => b.day - a.day || b.originalIndex - a.originalIndex);
    } else {
      movies.sort((a, b) => a.day - b.day || a.originalIndex - b.originalIndex);
    }
    renderControlList();
    renderGrid();
  }

  async function applyBulkUrls() {
    const rawText = document.getElementById('bulkUrls').value;
    const urls = rawText.split('\n').map(u => u.trim()).filter(u => u.length > 0);

    if (movies.length === 0) { alert("Impor file ZIP terlebih dahulu!"); return; }
    if (urls.length === 0) { alert("Tempelkan daftar link backdrop terlebih dahulu!"); return; }

    const btn = document.getElementById('btnBulk');
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Memproses...';
    btn.disabled = true;

    for (let i = 0; i < Math.min(movies.length, urls.length); i++) {
      try {
        movies[i].imageSrc = await fetchImageAsBase64(urls[i]);
      } catch (err) {}
    }

    renderControlList();
    renderGrid();

    btn.innerHTML = originalText;
    btn.disabled = false;
  }

  function renderControlList() {
    const listContainer = document.getElementById('csvMovieList');
    listContainer.innerHTML = '';

    movies.forEach(m => {
      const card = document.createElement('div');
      card.className = 'csv-movie-card';
      const yearText = m.year ? `<span>(${m.year})</span>` : '';
      card.innerHTML = `
        <div class="movie-title" title="${m.title}">${m.title} ${yearText}</div>
        <div class="poster-inputs">
          <input type="text" placeholder="Paste URL Backdrop..." onchange="updatePosterUrl('${m.id}', this.value)">
        </div>
      `;
      listContainer.appendChild(card);
    });
  }

  async function updatePosterUrl(id, url) {
    if (!url) return;
    const movie = movies.find(m => m.id === id);
    if (movie) {
      movie.imageSrc = await fetchImageAsBase64(url);
      renderGrid();
    }
  }

  function prevPage() { if (currentPage > 0) { currentPage--; renderGrid(); } }
  function nextPage() {
    const totalPages = Math.ceil(movies.length / pageSize) || 1;
    if (currentPage < totalPages - 1) { currentPage++; renderGrid(); }
  }

  function clearAll() {
    if (confirm("Reset seluruh data tontonan?")) {
      movies = [];
      currentPage = 0;
      document.getElementById('csvMovieList').innerHTML = '';
      document.getElementById('bulkUrls').value = '';
      document.getElementById('displayStats').innerText = '0 films watched';
      renderGrid();
    }
  }

  function renderGrid() {
    const grid = document.getElementById('backdropGrid');
    grid.innerHTML = '';

    const totalPages = Math.ceil(movies.length / pageSize) || 1;
    if (currentPage >= totalPages) currentPage = totalPages - 1;
    if (currentPage < 0) currentPage = 0;

    document.getElementById('cardPageIndicator').innerText = `${currentPage + 1}/${totalPages}`;
    document.getElementById('pageIndicatorText').innerText = `Slide ${currentPage + 1} dari ${totalPages}`;

    const startIndex = currentPage * pageSize;
    const pageMovies = movies.slice(startIndex, startIndex + pageSize);

    pageMovies.forEach(m => {
      const item = document.createElement('div');
      item.className = 'backdrop-item';
      const yearDisplay = m.year ? `<span class="movie-year-text">(${m.year})</span>` : '';

      item.innerHTML = `
        <img src="${m.imageSrc}" class="backdrop-img" crossorigin="anonymous" alt="${m.title}">
        <div class="gradient-overlay">
          <div class="movie-title-text" title="${m.title}">${m.title}</div>
          ${yearDisplay}
        </div>
      `;
      grid.appendChild(item);
    });

    fitPreview();
  }

  function fitPreview() {
    const inner = document.getElementById('stageInner');
    const w = inner.clientWidth, h = inner.clientHeight;
    if (!w || !h) return;
    document.getElementById('cardHolder').style.setProperty('--s', Math.min(w / 450, h / 800));
  }

  // EXPORT FUNCTIONS
  function exportCurrentPNG() {
    if (movies.length === 0) { alert("Belum ada film untuk diekspor."); return; }
    const card = document.getElementById('exportCard');
    const totalPages = Math.ceil(movies.length / pageSize) || 1;
    
    // Perbaikan html2canvas: Bikin background jadi solid pas difoto
    html2canvas(card, {
      scale: 1080 / 450,
      useCORS: true,
      allowTaint: true,
      backgroundColor: '#14181c',
      onclone: (clonedDoc) => {
        clonedDoc.getElementById('exportCard').style.background = '#14181c';
      }
    }).then(canvas => {
      const link = document.createElement('a');
      const monthStr = document.getElementById('displayMonth').innerText.replace(/\s+/g, '-');
      link.download = `Backdrop-${monthStr}-P${currentPage + 1}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }).catch(err => { alert("Gagal: " + err.message); });
  }

  async function exportAllPagesPNG() {
    if (movies.length === 0) { alert("Belum ada film untuk diekspor."); return; }

    const btn = document.getElementById('btnExportAll');
    const originalText = btn.innerHTML;
    const totalPages = Math.ceil(movies.length / pageSize) || 1;
    const originalPage = currentPage;

    btn.disabled = true;

    for (let p = 0; p < totalPages; p++) {
      currentPage = p;
      renderGrid();
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Slide ${p + 1}/${totalPages}...`;
      await new Promise(r => setTimeout(r, 400));

      const card = document.getElementById('exportCard');
      const canvas = await html2canvas(card, {
        scale: 1080 / 450,
        useCORS: true,
        allowTaint: true,
        backgroundColor: '#14181c',
        onclone: (clonedDoc) => {
          clonedDoc.getElementById('exportCard').style.background = '#14181c';
        }
      });

      const link = document.createElement('a');
      const monthStr = document.getElementById('displayMonth').innerText.replace(/\s+/g, '-');
      link.download = `Backdrop-${monthStr}-P${p + 1}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      await new Promise(r => setTimeout(r, 600));
    }

    currentPage = originalPage;
    renderGrid();
    btn.innerHTML = originalText;
    btn.disabled = false;
  }

  window.onload = () => {
    renderGrid();
    window.addEventListener('resize', fitPreview);
    if (window.ResizeObserver) { new ResizeObserver(fitPreview).observe(document.getElementById('stageInner')); }
  };
</script>

</body>
</html>
