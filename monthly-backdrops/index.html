<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Backdrops</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%2306080d'/%3E%3Ctext x='50' y='72' font-size='60' fill='%2300e054' text-anchor='middle' font-family='Arial, sans-serif'%3E%F0%9F%96%BC%EF%B8%8F%3C/text%3E%3C/svg%3E">
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    /* DASAR HITAM & TRANSISI */
    html, body { width: 100%; background-color: #06080d !important; color: #ffffff; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }
    body { min-height: 100vh; padding: 12px; display: flex; position: relative; animation: fadeInPage 0.5s ease forwards; }
    @keyframes fadeInPage { from { opacity: 0; } to { opacity: 1; } }
    body.fade-out { opacity: 0 !important; transition: opacity 0.4s ease; }

    /* BACKGROUND & TOMBOL BACK */
    #bgLayer { position: fixed; inset: 0; z-index: 0; background-image: url('../bg.jpg') !important; background-size: cover; background-position: center; background-repeat: no-repeat; opacity: 1 !important; pointer-events: none; }
    #bgLayer::before { content: ""; position: absolute; inset: 0; background: rgba(6, 8, 13, 0.35); z-index: 1; }

    .btn-back-home { position: fixed; top: 20px; left: 20px; z-index: 9999; display: inline-flex; align-items: center; gap: 8px; background: rgba(20, 24, 28, 0.72); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 8px; padding: 8px 14px; font-size: 11.5px; font-weight: 700; color: #fff; text-decoration: none; cursor: pointer; transition: all 0.2s ease; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .btn-back-home:hover { background: rgba(25, 30, 36, 0.9); border-color: #00e054; color: #00e054; transform: translateY(-2px); }

    /* LAYOUT UTAMA */
    :root {
      --accent: #00e054;
      --panel-bg: rgba(20, 24, 28, 0.72);
      --panel-blur: 12px;
      --stage-h: min(calc(100vh - 24px), calc((100vw - 392px - 30px) * 1.7778 + 30px), 1100px);
      --stage-w: calc((var(--stage-h) - 30px) * 0.5625 + 30px);
      --left-w: clamp(340px, calc(var(--stage-w) * 1.1), 520px);
    }

    .main-layout { position: relative; z-index: 1; margin: auto; height: var(--stage-h); display: grid; grid-template-columns: var(--left-w) var(--stage-w); column-gap: 28px; align-items: stretch; }

    /* PANEL KIRI */
    .control-panel { height: 100%; min-height: 0; background: var(--panel-bg); -webkit-backdrop-filter: blur(var(--panel-blur)); backdrop-filter: blur(var(--panel-blur)); border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 12px; padding: 16px; display: flex; flex-direction: column; overflow-y: auto; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    .panel-title { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; flex: 0 0 auto; }
    .form-group label { font-size: 10px; color: var(--accent); font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
    input[type="text"], select, textarea { background: #0f1115; border: 1px solid #2c3440; color: #fff; padding: 8px; border-radius: 6px; font-size: 11.5px; outline: none; width: 100%; }
    textarea { font-family: monospace; font-size: 10.5px; line-height: 1.5; resize: vertical; min-height: 100px; }
    input[type="file"] { color: #8a9bb0; background: #0f1115; border: 1px solid #2c3440; padding: 4px; border-radius: 6px; font-size: 11px; cursor: pointer; width: 100%; }
    input[type="file"]::file-selector-button { background: #222a33; color: #ffffff; border: 1px solid #3a4654; padding: 6px 12px; border-radius: 4px; font-weight: 600; cursor: pointer; margin-right: 8px; }
    
    .hint { font-size: 10.5px; line-height: 1.45; color: #9ab1c2; background: rgba(15, 17, 21, 0.7); border: 1px solid rgba(44, 52, 64, 0.8); border-radius: 8px; padding: 7px 9px; }
    .status-box { font-size: 11px; color: #F4D160; background: rgba(15, 17, 21, 0.7); border: 1px solid rgba(44, 52, 64, 0.8); padding: 8px 10px; border-radius: 8px; margin-bottom: 12px; line-height: 1.45; flex: 0 0 auto; }

    .btn { padding: 8px 10px; border: none; border-radius: 6px; font-weight: 700; font-size: 11px; cursor: pointer; transition: 0.2s; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:disabled { opacity: 0.6; cursor: wait; }
    .btn-export { background: #ff8000; color: #ffffff; width: 100%; padding: 10px; margin-top: 10px; }
    .btn-export:hover { background: #e07000; }

    /* PANEL KANAN (KACA TRANSPARAN) */
    .stage-panel { 
      position: relative; height: 100%; 
      background: var(--panel-bg); 
      -webkit-backdrop-filter: blur(var(--panel-blur)); backdrop-filter: blur(var(--panel-blur)); 
      border: 1px solid rgba(255, 255, 255, 0.10); border-radius: 12px; 
      box-shadow: 0 10px 30px rgba(0,0,0,0.5); 
      display: flex; flex-direction: column;
    }
    
    .stage-inner { position: absolute; inset: 14px; overflow: hidden; display: flex; justify-content: center; align-items: center; }
    
    /* KANVAS 9:16 */
    .card-holder { position: relative; width: 450px; height: 800px; transform: scale(var(--s, 1)); transform-origin: center center; }
    .recap-card { 
      width: 450px; height: 800px; 
      background-color: #14181c; /* Solid pas di-export, tapi transparan di layar */
      padding: 24px 20px 18px 20px; 
      border-radius: 12px; display: flex; flex-direction: column; position: relative; overflow: hidden; 
    }
    
    .card-header { text-align: center; margin-bottom: 14px; flex: 0 0 auto; }
    .card-title { font-size: 24px; font-weight: 800; line-height: 1.1; color: #ffffff; }
    .card-subtitle { font-size: 12px; color: var(--accent); font-weight: 700; margin-top: 4px; }

    /* GRID BACKDROP */
    .backdrop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; flex: 1 1 auto; align-content: start; }
    
    .backdrop-item { 
      position: relative; width: 100%; 
      border-radius: 8px; overflow: hidden; 
      background: #1e262c; 
      border: 1px solid rgba(255,255,255,0.1); 
      box-shadow: 0 4px 10px rgba(0,0,0,0.5); 
      display: flex; flex-direction: column;
    }
    
    /* Gambar dibiarkan mengikuti proporsi asli (biasanya 16:9) */
    .backdrop-item img { width: 100%; height: auto; display: block; min-height: 90px; object-fit: cover; }
    
    .bd-text-wrapper { padding: 6px 8px; background: #14181c; }
    .bd-title { font-size: 10.5px; font-weight: 700; line-height: 1.25; color: #fff; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .bd-year { font-size: 9.5px; font-weight: 600; color: #8a9bb0; margin-top: 3px; display: block; }

    .user-profile-card { flex: 0 0 auto; border-top: 1px solid rgba(255, 255, 255, 0.08); padding-top: 8px; margin-top: 12px; display: flex; align-items: center; justify-content: center; }
    .lbxd-brand { display: flex; align-items: center; gap: 6px; }
    .lbxd-dots { font-size: 11px; letter-spacing: -2px; line-height: 1; }
    .brand-name { font-size: 11px; font-weight: 800; color: #ffffff; }

    /* NAVIGASI SLIDE */
    .slide-nav { display: flex; justify-content: center; align-items: center; gap: 12px; padding: 10px 0; position: relative; z-index: 10; }
    .slide-nav button { background: #2c3440; border: none; color: #fff; width: 28px; height: 28px; border-radius: 50%; font-size: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: 0.2s; }
    .slide-nav button:hover { background: var(--accent); color: #14181c; }
    .slide-nav span { font-size: 11px; font-weight: 700; color: #8a9bb0; }

    @media (max-width: 900px) {
      .main-layout { width: 100%; height: auto; grid-template-columns: 1fr; row-gap: 15px; }
      .stage-panel { height: auto; width: 100%; max-width: 480px; margin: 0 auto; aspect-ratio: 9/16; }
    }
  </style>
</head>
<body>

<a href="../" class="btn-back-home" onclick="goBackHome(event)">
  <i class="fa-solid fa-arrow-left"></i> Kembali ke Home
</a>

<div id="bgLayer"></div>

<div class="main-layout">
  <!-- Panel Kiri -->
  <div class="control-panel">
    <div class="panel-title"><i class="fa-solid fa-images"></i> Monthly Backdrops</div>

    <div class="form-group">
      <label>1. Upload ZIP Letterboxd</label>
      <input type="file" id="zipFileInput" accept=".zip" onchange="processZipFile()">
      <div class="hint">Untuk mengambil daftar film & tahun rilis berdasarkan tanggal tonton.</div>
    </div>

    <div class="status-box" id="statusMessage">Status: Menunggu ZIP...</div>

    <div class="form-group" style="flex-direction: row; gap: 8px;">
      <div style="flex: 1;">
        <label>Bulan</label>
        <select id="selectMonth" onchange="renderApp()">
          <option value="0">Januari</option>
          <option value="1">Februari</option>
          <option value="2">Maret</option>
          <option value="3">April</option>
          <option value="4">Mei</option>
          <option value="5">Juni</option>
          <option value="6">Juli</option>
          <option value="7">Agustus</option>
          <option value="8" selected>September</option>
          <option value="9">Oktober</option>
          <option value="10">November</option>
          <option value="11">Desember</option>
        </select>
      </div>
      <div style="flex: 1;">
        <label>Tahun</label>
        <input type="text" id="inputYear" value="2026" oninput="renderApp()">
      </div>
    </div>

    <div class="form-group">
      <label>2. Paste Massal Link Backdrop (16:9)</label>
      <textarea id="inputBackdrops" placeholder="https://image.tmdb.org/t/p/original/backdrop1.jpg&#10;https://image.tmdb.org/t/p/original/backdrop2.jpg" oninput="renderApp()"></textarea>
      <div class="hint">Urutan baris sesuai urutan film yang ditonton. (1 baris = 1 backdrop).</div>
    </div>

    <button class="btn btn-export" onclick="exportCurrentSlide()"><i class="fa-solid fa-download"></i> Download Slide Ini (PNG)</button>
  </div>

  <!-- Panel Kanan -->
  <div class="stage-panel">
    <div class="stage-inner" id="stageInner">
      <div class="card-holder" id="cardHolder">
        
        <!-- Desain Kartu -->
        <div class="recap-card" id="exportCard">
          <div class="card-header">
            <div class="card-title" id="outMonthYear">September 2026</div>
            <div class="card-subtitle" id="outTotalFilms">12 films watched</div>
          </div>

          <div class="backdrop-grid" id="backdropGrid">
            <!-- Grid Backdrop dirender via JS -->
          </div>

          <div class="user-profile-card">
            <div class="lbxd-brand">
              <div class="lbxd-dots"><span style="color:#00e054;">●</span><span style="color:#ff8000;">●</span><span style="color:#40bcf4;">●</span></div>
              <span class="brand-name">Letterboxd</span>
            </div>
          </div>
        </div>

      </div>
    </div>
    
    <!-- Navigasi Slide (Disembunyikan default, muncul kalau > 1 slide) -->
    <div class="slide-nav" id="slideNav" style="display: none;">
      <button onclick="prevSlide()"><i class="fa-solid fa-chevron-left"></i></button>
      <span id="slideCounter">1/2</span>
      <button onclick="nextSlide()"><i class="fa-solid fa-chevron-right"></i></button>
    </div>
  </div>
</div>

<script>
  function goBackHome(e) {
    e.preventDefault();
    document.body.classList.add('fade-out');
    setTimeout(() => { window.location.href = '../'; }, 400);
  }

  const MONTHS = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
  const MAX_PER_SLIDE = 10; // 2 kolom x 5 baris

  let diaryEntries = []; 
  let currentSlide = 0;

  async function processZipFile() {
    const file = document.getElementById('zipFileInput').files[0];
    if (!file) return;
    const status = document.getElementById('statusMessage');
    status.innerText = 'Membuka file ZIP...';

    try {
      const zip = await JSZip.loadAsync(file);
      const findFile = re => zip.file(re).filter(f => !/(^|\/)(deleted|orphaned)\//i.test(f.name))[0] || null;
      const readCSV = async re => {
        const f = findFile(re);
        if (!f) return null;
        const text = (await f.async('string')).replace(/^\uFEFF/, '');
        return Papa.parse(text, { header: true, skipEmptyLines: true }).data;
      };

      const diary = await readCSV(/(^|\/)diary\.csv$/i);
      if (!diary) { status.innerText = 'Error: diary.csv tidak ditemukan.'; return; }

      diaryEntries = diary.map(row => {
        const dateStr = row['Watched Date'] || row['Date'];
        if (!dateStr) return null;
        const parts = dateStr.split('-');
        if (parts.length < 3) return null;
        
        return {
          title: (row['Name'] || '').trim() || 'Untitled',
          year: row['Year'] || '',
          y: parseInt(parts[0]),
          m: parseInt(parts[1]) - 1,
          d: parseInt(parts[2])
        };
      }).filter(Boolean);

      status.innerText = `Selesai! ${diaryEntries.length} entri diary ditemukan.`;
      renderApp();

    } catch (err) {
      status.innerText = 'Gagal: ' + err.message;
    }
  }

  function renderApp() {
    const m = parseInt(document.getElementById('selectMonth').value);
    const y = parseInt(document.getElementById('inputYear').value) || new Date().getFullYear();
    const backdropsText = document.getElementById('inputBackdrops').value.trim();
    const backdropUrls = backdropsText ? backdropsText.split('\n').map(u => u.trim()).filter(u => u) : [];

    document.getElementById('outMonthYear').innerText = `${MONTHS[m]} ${y}`;

    const monthFilms = diaryEntries.filter(f => f.y === y && f.m === m);
    monthFilms.sort((a, b) => a.d - b.d);

    document.getElementById('outTotalFilms').innerText = `${monthFilms.length} films watched`;

    const grid = document.getElementById('backdropGrid');
    grid.innerHTML = '';

    if (monthFilms.length === 0) {
      grid.innerHTML = '<div style="grid-column: span 2; text-align: center; color: #8a9bb0; font-size: 13px; padding-top: 50px;">Belum ada data film di bulan ini.</div>';
      document.getElementById('slideNav').style.display = 'none';
      return;
    }

    const totalSlides = Math.ceil(monthFilms.length / MAX_PER_SLIDE);
    
    if (currentSlide >= totalSlides) currentSlide = totalSlides - 1;
    if (currentSlide < 0) currentSlide = 0;

    // Tampilkan navigasi jika lebih dari 1 slide
    if (totalSlides > 1) {
      document.getElementById('slideNav').style.display = 'flex';
      document.getElementById('slideCounter').innerText = `${currentSlide + 1}/${totalSlides}`;
    } else {
      document.getElementById('slideNav').style.display = 'none';
    }

    const startIndex = currentSlide * MAX_PER_SLIDE;
    const endIndex = startIndex + MAX_PER_SLIDE;
    const slideFilms = monthFilms.slice(startIndex, endIndex);

    slideFilms.forEach((film, index) => {
      const url = backdropUrls[startIndex + index] || 'https://via.placeholder.com/400x225/1e262c/4a5a6a?text=No+Backdrop';
      
      const item = document.createElement('div');
      item.className = 'backdrop-item';
      item.innerHTML = `
        <img src="${url}" alt="${film.title}" onerror="this.src='https://via.placeholder.com/400x225/1e262c/4a5a6a?text=Error'">
        <div class="bd-text-wrapper">
          <div class="bd-title">${film.title}</div>
          ${film.year ? `<div class="bd-year">${film.year}</div>` : ''}
        </div>
      `;
      grid.appendChild(item);
    });

    fitPreview();
  }

  function prevSlide() {
    if (currentSlide > 0) { currentSlide--; renderApp(); }
  }
  function nextSlide() {
    const m = parseInt(document.getElementById('selectMonth').value);
    const y = parseInt(document.getElementById('inputYear').value) || new Date().getFullYear();
    const totalMonthFilms = diaryEntries.filter(f => f.y === y && f.m === m).length;
    const totalSlides = Math.ceil(totalMonthFilms / MAX_PER_SLIDE);
    
    if (currentSlide < totalSlides - 1) { currentSlide++; renderApp(); }
  }

  function fitPreview() {
    const inner = document.getElementById('stageInner');
    const w = inner.clientWidth;
    const h = inner.clientHeight;
    if (!w || !h) return;
    const scale = Math.min(w / 450, h / 800);
    document.getElementById('cardHolder').style.setProperty('--s', scale);
  }

  async function exportCurrentSlide() {
    const btn = event.currentTarget;
    const originalText = btn.innerHTML;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Membuat PNG...';
    btn.disabled = true;

    try {
      const card = document.getElementById('exportCard');
      
      const clone = card.cloneNode(true);
      // Paksa jadi solid hitam saat export
      clone.style.cssText = `display:flex; position:relative; width:450px; height:800px; transform:none; border-radius:0; box-shadow:none; background-color:#14181c;`;
      
      const stage = document.createElement('div');
      stage.style.cssText = `position:fixed; left:-10000px; top:0; width:450px; height:800px; overflow:hidden; pointer-events:none;`;
      stage.appendChild(clone);
      document.body.appendChild(stage);

      const canvas = await html2canvas(clone, {
        scale: 1080 / 450, 
        width: 450, height: 800,
        scrollX: 0, scrollY: 0, useCORS: true, allowTaint: true,
        backgroundColor: '#14181c', logging: false
      });

      document.body.removeChild(stage);

      const link = document.createElement('a');
      link.download = `Backdrop-${MONTHS[parseInt(document.getElementById('selectMonth').value)]}-${document.getElementById('inputYear').value}-P${currentSlide+1}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();

    } catch (err) {
      alert("Gagal export: " + err.message);
    } finally {
      btn.innerHTML = originalText;
      btn.disabled = false;
    }
  }

  window.onload = () => {
    renderApp();
    window.addEventListener('resize', fitPreview);
    if (window.ResizeObserver) { new ResizeObserver(fitPreview).observe(document.getElementById('stageInner')); }
  };
</script>

</body>
</html>
